<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <p>Links demo</p>

    <!-- External Link -->
    <a href="https://abes.ac.in" target="_blank">External link</a><br>

    <!-- Internal Link -->
    <a href="#bottom">Jump to bottom</a><br>

    <!-- Email Link -->
    <a href="mailto:info@abes.ac.in">Email us</a><br>

    <!-- Image Link using a live online URL -->
    <a href="https://abes.ac.in" target="_blank">
        Logo<br>
        <img src="https://githubusercontent.com" alt="ABES Engineering College Logo" width="120" height="120" border="1">
    </a>

    <!-- Target section for internal link -->
    <div id="bottom" style="margin-top: 500px;">
        <p>Bottom of the page</p>
    </div>

</body>
</html>
